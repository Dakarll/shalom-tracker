name: Verificar envíos Shalom

on:
  schedule:
    # Cada 30 minutos. Nota: GitHub Actions no garantiza precisión exacta
    # en horarios de alta demanda; puede haber unos minutos de retraso.
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # permite ejecutarlo manualmente desde la pestaña "Actions"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar ffmpeg (para generar el video del QR)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias
        working-directory: scripts
        run: npm install

      - name: Instalar navegador de Playwright
        working-directory: scripts
        run: npx playwright install --with-deps chromium

      - name: Ejecutar verificación
        working-directory: scripts
        env:
          BACK4APP_APP_ID: ${{ secrets.BACK4APP_APP_ID }}
          BACK4APP_MASTER_KEY: ${{ secrets.BACK4APP_MASTER_KEY }}
        run: node check_shalom.js
